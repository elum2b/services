version: "2"

run:
  timeout: 5m
  tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: standard
  exclusions:
    rules:
      # These DTOs mirror external provider protocols whose JSON field names
      # are fixed by those protocols and are intentionally not snake_case.
      - path: control/adapters/ton_connect\.go
        linters:
          - tagliatelle
      - path: payment/adapters/platega/types\.go
        linters:
          - tagliatelle
      - path: payment/dexscreener\.go
        linters:
          - tagliatelle
      - path: payment/payment_test\.go
        linters:
          - tagliatelle
      - path: payment/tonconnect/manifest\.go
        linters:
          - tagliatelle
  disable:
    # ETP controller registration is intentionally side-effect-only: handlers
    # follow the established `func(event string, socket etp.Router)` contract.
    - errcheck
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - errorlint
    - gomoddirectives
    - misspell
    - nilerr
    - nilnil
    - nlreturn
    - noctx
    - prealloc
    - tagliatelle
    - testifylint
    - unconvert
    - usestdlibvars
    - wsl_v5

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    depguard:
      rules:
        main:
          deny:
            - pkg: github.com/pkg/errors
              desc: use the standard errors package
    gomoddirectives:
      check-module-path: true
      exclude-forbidden: true
      ignore-forbidden: true
    nlreturn:
      block-size: 2
    tagliatelle:
      case:
        rules:
          json: snake
    testifylint:
      enable-all: true
    wsl_v5:
      default: all
formatters:
  enable:
    - gci
    - gofmt
    - goimports
    - golines

  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/elum2b/services)
      custom-order: true
    golines:
      max-len: 80
    goimports:
      local-prefixes:
        - github.com/elum2b/services
